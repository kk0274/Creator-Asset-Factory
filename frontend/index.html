<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>达人视频素材拆分与分类系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #fbfaf9;
      --card: #fbfaf9;
      --popover: #fbfaf9;
      --foreground: #3b352b;
      --card-foreground: #3b352b;
      --popover-foreground: #3b352b;
      --muted-foreground: #978365;
      --primary: #3b352b;
      --primary-foreground: #fbfaf9;
      --secondary: #9b965f;
      --secondary-foreground: #fbfaf9;
      --muted: #eae6db;
      --accent: #cbc0aa;
      --accent-foreground: #574d42;
      --destructive: #ef4444;
      --destructive-foreground: #fafafa;
      --border: #e1dccf;
      --input: #eae6db;
      --ring: #3b352b;
      --sidebar: #fbfaf9;
      --sidebar-foreground: #3b352b;
      --sidebar-primary: #3b352b;
      --sidebar-primary-foreground: #fbfaf9;
      --sidebar-accent: #cbc0aa;
      --sidebar-accent-foreground: #3b352b;
      --sidebar-border: #e1dccf;
      --sidebar-ring: #3b352b;
      --radius: 2rem;
      --shadow-xs: 0px 2px 4px 0px hsl(35 15% 50% / 0.00);
      --shadow-sm: 0px 2px 4px 0px hsl(35 15% 50% / 0.00), 0px 1px 2px -1px hsl(35 15% 50% / 0.00);
      --spacing: 0.3rem;
      --tracking-normal: 0.01em;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Fraunces', ui-serif, serif;
      letter-spacing: var(--tracking-normal);
      background: var(--background);
      color: var(--foreground);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
